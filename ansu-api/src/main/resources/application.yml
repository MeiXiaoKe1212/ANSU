server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ansu_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ansu-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000 # 24小时，单位毫秒

# 日志配置
logging:
  level:
    com.ansu.api: debug
